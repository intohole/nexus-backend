[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-backend"
version = "1.60.1"
description = "通用后端中间件框架 - 与ironman平行的非LLM后端能力集"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.19.0",
    "httpx>=0.24.0",
    "python-jose[cryptography]>=3.3.0",
    "starlette>=0.27.0",
    "python-multipart>=0.0.6",
    "pyyaml>=6.0",
    "cachetools>=5.3.0",
    "ironman-llm==0.10.6",
    "apscheduler>=3.10.0",
    "croniter>=2.0.0",
]

[project.optional-dependencies]
loguru = ["loguru>=0.7.0"]
excel = ["openpyxl>=3.1"]
all = ["loguru>=0.7.0", "openpyxl>=3.1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["nexus*"]
