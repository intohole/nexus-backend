[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-backend"
version = "1.109.0"
description = "通用后端中间件框架 - 与ironman平行的非LLM后端能力集"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.141.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.0.53",
    "aiosqlite>=0.22.1",
    "httpx>=0.28.1",
    "python-jose[cryptography]>=3.5.0",
    "starlette>=1.6.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "cachetools>=7.2.0",
    "ironman-llm==0.13.0",
    "apscheduler>=3.11.3",
    "croniter>=6.2.4",
]

[project.optional-dependencies]
loguru = ["loguru>=0.7.2"]
excel = ["openpyxl>=3.1.5"]
all = ["loguru>=0.7.2", "openpyxl>=3.1.5"]

[tool.setuptools.packages.find]
where = ["."]
include = ["nexus*"]
